{% extends "fanhub_admin_base.html" %}
{% block title %}Notifications - Fan Hub | Ekhaya Nexus{% endblock %}
{% block fanhub_content %}
<div class="page-header-inner" style="margin-bottom:16px">
  <h1 class="page-title">Send Notification</h1>
  <a class="btn btn-outline" href="{{ url_for('fanhub.admin_fanhub') }}">&larr; Hub</a>
</div>

<div class="form-section">
  <form method="POST" class="app-form">
    <div class="form-grid">
      <div class="form-group"><label>Title *</label><input type="text" name="title" required></div>
      <div class="form-group"><label>Target</label>
        <select name="target">
          <option value="all">All fans</option>
          <option value="single">Single fan</option>
        </select>
      </div>
      <div class="form-group"><label>Fan (if single)</label>
        <select name="fan_id">
          {% for f in fans %}
          <option value="{{ f['id'] }}">{{ f['first_name'] }} {{ f['last_name'] }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group" style="grid-column:1/-1"><label>Body</label><input type="text" name="body"></div>
    </div>
    <button class="btn btn-gold" type="submit">Send</button>
  </form>
</div>
{% endblock %}
