<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ekhaya Nexus{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=20260905h">
</head>
<body class="{% block body_class %}{% endblock %}">
  <div class="pitch-lines" aria-hidden="true"></div>

  <header class="topbar">
    <a class="brand" href="{{ url_for('club_landing') }}">
      <img class="brand-mark" src="{{ url_for('static', filename='img/crest.png') }}" alt="Ekhaya FC crest">
      <span class="brand-name">Ekhaya FC</span>
    </a>
    {% if team %}
      <span class="topbar-team">{{ team['name'] }}</span>
    {% endif %}
  </header>

  {% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
  <div class="flash-container">
    {% for category, message in messages %}
    <div class="flash flash-{{ category }}">{{ message }}</div>
    {% endfor %}
  </div>
  {% endif %}
  {% endwith %}

  <main class="content">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
