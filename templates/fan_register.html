{% extends "fan_base.html" %}
{% block title %}Fan Registration - Ekhaya FC{% endblock %}
{% block body_class %}fan-auth{% endblock %}
{% block content %}
<div class="fan-auth-wrap">
  <div class="fan-auth-card fan-auth-reg">
    <img class="fan-auth-crest" src="{{ url_for('static', filename='img/crest.png') }}" alt="Ekhaya FC">
    <h1 class="fan-auth-title">JOIN EKHAYA FC</h1>
    <p class="fan-auth-sub">Create your Fan Hub account</p>
    <form method="POST" class="fan-form">
      <div class="fan-form-row">
        <div><label>First Name *</label>
          <input type="text" name="first_name" value="{{ form.get('first_name','') }}" required></div>
        <div><label>Last Name *</label>
          <input type="text" name="last_name" value="{{ form.get('last_name','') }}" required></div>
      </div>
      <div class="fan-form-row">
        <div><label>Date of Birth</label>
          <input type="date" name="dob" value="{{ form.get('dob','') }}"></div>
        <div><label>Gender</label>
          <select name="gender">
            <option value="">Select</option>
            {% for g in ['Male','Female','Other'] %}
            <option value="{{ g }}" {% if form.get('gender')==g %}selected{% endif %}>{{ g }}</option>
            {% endfor %}
          </select></div>
      </div>
      <div class="fan-form-row">
        <div><label>Phone</label>
          <input type="text" name="phone" placeholder="+265..." value="{{ form.get('phone','') }}"></div>
        <div><label>Email *</label>
          <input type="email" name="email" value="{{ form.get('email','') }}" required></div>
      </div>
      <label>District / Location</label>
      <input type="text" name="district" value="{{ form.get('district','') }}">
      <label>Favourite Ekhaya FC Team</label>
      <select name="favourite_team">
        {% for t in teams %}
        <option value="{{ t }}" {% if form.get('favourite_team')==t %}selected{% endif %}>{{ t }}</option>
        {% endfor %}
      </select>
      <div class="fan-form-row">
        <div><label>Password *</label>
          <input type="password" name="password" required></div>
        <div><label>Confirm Password *</label>
          <input type="password" name="confirm_password" required></div>
      </div>
      <details class="fan-details">
        <summary>Emergency contact (optional)</summary>
        <label>Emergency name</label>
        <input type="text" name="emergency_name">
        <label>Emergency phone</label>
        <input type="text" name="emergency_phone">
      </details>
      <button class="fan-btn fan-btn-gold" type="submit">Create Account</button>
    </form>
    <p class="fan-auth-alt">Already a member?
      <a href="{{ url_for('fanhub.fan_login') }}">Sign in</a>
    </p>
  </div>
</div>
{% endblock %}
