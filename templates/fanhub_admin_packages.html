{% extends "fanhub_admin_base.html" %}
{% block title %}Packages - Fan Hub | Ekhaya Nexus{% endblock %}
{% block fanhub_content %}
<div class="page-header-inner" style="margin-bottom:16px">
  <h1 class="page-title">Membership Packages</h1>
  <a class="btn btn-outline" href="{{ url_for('fanhub.admin_fanhub') }}">&larr; Hub</a>
</div>

<div class="form-section">
  <h2 class="section-title" style="margin-bottom:12px">Create package</h2>
  <form method="POST" class="app-form">
    <div class="form-grid">
      <div class="form-group"><label>Name *</label><input type="text" name="name" required placeholder="Silver"></div>
      <div class="form-group"><label>Level</label><input type="number" name="level" value="0"></div>
      <div class="form-group"><label>Price (MWK)</label><input type="number" step="0.01" name="price" value="0"></div>
      <div class="form-group"><label>Duration (days)</label><input type="number" name="duration_days" value="365"></div>
      <div class="form-group" style="grid-column:1/-1"><label>Description</label><input type="text" name="description"></div>
      <div class="form-group" style="grid-column:1/-1"><label>Benefits (comma separated)</label><input type="text" name="benefits" placeholder="News, Discounted tickets"></div>
    </div>
    <label style="display:flex;gap:8px;align-items:center;margin:8px 0 16px"><input type="checkbox" name="is_active" checked> Active</label>
    <button class="btn btn-gold" type="submit">Create Package</button>
  </form>
</div>

<h2 class="section-title" style="margin-top:26px">Existing packages</h2>
<div class="table-wrap">
  <table class="data-table">
    <thead><tr><th>Name</th><th>Level</th><th>Price</th><th>Days</th><th>Active</th><th>Actions</th></tr></thead>
    <tbody>
      {% for p in packages %}
      <tr>
        <td colspan="6" style="background:rgba(255,255,255,0.03)">
          <form method="POST" action="{{ url_for('fanhub.admin_fanhub_package_update', pkg_id=p['id']) }}" class="app-form" style="display:grid;grid-template-columns:160px 70px 110px 110px 1fr auto auto;gap:8px;align-items:end">
            <div><label>Name</label><input type="text" name="name" value="{{ p['name'] }}"></div>
            <div><label>Level</label><input type="number" name="level" value="{{ p['level'] }}"></div>
            <div><label>Price</label><input type="number" step="0.01" name="price" value="{{ p['price_mwk'] }}"></div>
            <div><label>Days</label><input type="number" name="duration_days" value="{{ p['duration_days'] }}"></div>
            <div style="display:flex;align-items:center;gap:6px;padding-top:18px"><input type="checkbox" name="is_active" {% if p['is_active'] %}checked{% endif %}> Active</div>
            <button class="btn btn-gold" type="submit" style="padding:6px 12px">Save</button>
            <button class="btn btn-outline" type="submit" name="action" value="toggle" style="padding:6px 12px">{{ 'Disable' if p['is_active'] else 'Enable' }}</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
