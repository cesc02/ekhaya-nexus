<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Change Password - Ekhaya Nexus</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=20260907">
</head>
<body class="admin-body admin-login-body">
  <main class="admin-login-wrap">
    <div class="admin-login-card">
      <img class="admin-login-logo" src="{{ url_for('static', filename='img/crest.png') }}" alt="Ekhaya FC crest">
      <h1 class="admin-login-title">Change Password</h1>
      <p class="admin-login-sub">Rotate your admin password. Minimum 10 characters.</p>

      {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
      <div class="flash-container" style="margin:0 auto 16px">
        {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      </div>
      {% endif %}
      {% endwith %}

      <form method="POST" class="admin-login-form">
        <div class="form-group">
          <label>Current password</label>
          <input type="password" name="current_password" required autofocus>
        </div>
        <div class="form-group">
          <label>New password</label>
          <input type="password" name="new_password" required minlength="10">
        </div>
        <div class="form-group">
          <label>Confirm new password</label>
          <input type="password" name="confirm_password" required minlength="10">
        </div>
        <button class="btn btn-gold" type="submit" style="margin-top:8px">Update Password</button>
      </form>
      <p class="admin-login-back"><a href="{{ url_for('admin_dashboard') }}">&larr; Back to dashboard</a></p>
    </div>
  </main>
</body>
</html>
