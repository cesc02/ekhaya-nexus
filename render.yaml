services:
  - type: web
    name: ekhaya-nexus
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 --access-logfile -
    healthCheckPath: /
    envVars:
      - key: PYTHONUNBUFFERED
        value: "true"